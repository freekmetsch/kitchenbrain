<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Keukenbrein household work surfaces — design shotgun</title>
	<style>
		:root {
			--grove: #344f3e;
			--grove-2: #42604c;
			--paper: #f8f5ed;
			--card: #fffefa;
			--ink: #27312b;
			--muted: #647069;
			--line: #ded8cc;
			--terra: #aa5233;
			--honey: #d8aa55;
			--honey-ink: #69460f;
			--wash: #f2ead9;
			--white: #fffdf7;
			--shadow: 0 12px 34px rgb(24 45 33 / 12%);
			--soft-shadow: 0 5px 16px rgb(24 45 33 / 9%);
			--radius: 14px;
			--control-radius: 8px;
			font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			color: var(--ink);
			background: #e7e2d7;
		}

		* { box-sizing: border-box; }
		html { scroll-behavior: smooth; }
		body { margin: 0; min-width: 320px; background: #e7e2d7; }
		button, select, textarea, input { font: inherit; }
		button, select { min-height: 44px; }
		button { cursor: pointer; }
		a { color: inherit; }
		.sr-only {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border: 0;
		}

		.hero {
			background: var(--grove);
			color: var(--white);
			padding: 38px max(20px, calc((100vw - 1180px) / 2)) 34px;
		}
		.hero-inner { max-width: 1180px; margin: 0 auto; }
		.eyebrow {
			margin: 0 0 8px;
			color: #dce8de;
			font-size: 12px;
			font-weight: 800;
			letter-spacing: .11em;
			text-transform: uppercase;
		}
		h1, h2, h3, p { margin-top: 0; }
		h1 {
			max-width: 780px;
			margin-bottom: 12px;
			font-size: clamp(2rem, 5vw, 4.4rem);
			line-height: .98;
			letter-spacing: -.055em;
		}
		.hero-copy {
			max-width: 760px;
			margin-bottom: 22px;
			color: #dce8de;
			font-size: clamp(.95rem, 1.5vw, 1.08rem);
			line-height: 1.6;
		}
		.hero-stats {
			display: flex;
			flex-wrap: wrap;
			gap: 8px;
		}
		.hero-stat {
			display: flex;
			gap: 7px;
			align-items: baseline;
			min-height: 44px;
			padding: 10px 13px;
			border: 1px solid rgb(255 255 255 / 18%);
			border-radius: 10px;
			background: rgb(255 255 255 / 7%);
		}
		.hero-stat strong { font-size: 18px; }
		.hero-stat span { color: #dce8de; font-size: 12px; }

		.control-bar {
			position: sticky;
			z-index: 90;
			top: 0;
			display: flex;
			flex-wrap: wrap;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding: 9px max(16px, calc((100vw - 1180px) / 2));
			border-bottom: 1px solid var(--line);
			background: rgb(248 245 237 / 94%);
			backdrop-filter: blur(14px);
		}
		.control-group { display: flex; flex-wrap: wrap; gap: 6px; }
		.control-button, .button {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 7px;
			border: 1px solid color-mix(in srgb, var(--grove) 25%, var(--line));
			border-radius: var(--control-radius);
			padding: 0 12px;
			background: transparent;
			color: var(--grove);
			font-size: 12px;
			font-weight: 760;
		}
		.control-button[aria-pressed="true"], .button-primary {
			border-color: var(--grove);
			background: var(--grove);
			color: white;
		}
		.button-clay { border-color: var(--terra); background: var(--terra); color: white; }
		.button-quiet { border-color: transparent; }
		.control-button:focus-visible, .button:focus-visible, select:focus-visible, textarea:focus-visible {
			outline: 3px solid color-mix(in srgb, var(--honey) 75%, white);
			outline-offset: 2px;
		}
		.storage-state { color: var(--muted); font-size: 11px; }
		.storage-state.warn { color: #8e4b28; font-weight: 700; }

		main { max-width: 1220px; margin: 0 auto; padding: 24px 20px 70px; }
		.intro-grid {
			display: grid;
			grid-template-columns: minmax(0, 1.4fr) minmax(270px, .6fr);
			gap: 18px;
			margin-bottom: 24px;
		}
		.panel {
			border: 1px solid var(--line);
			border-radius: var(--radius);
			background: var(--paper);
			box-shadow: var(--soft-shadow);
		}
		.intro-copy { padding: 22px; }
		.intro-copy h2, .section-heading h2 { margin-bottom: 8px; font-size: 24px; letter-spacing: -.025em; }
		.intro-copy p, .section-heading p { color: var(--muted); line-height: 1.6; }
		.recommendation {
			padding: 20px;
			border-top: 5px solid var(--terra);
		}
		.recommendation .label {
			display: inline-flex;
			margin-bottom: 10px;
			padding: 4px 7px;
			border-radius: 6px;
			background: color-mix(in srgb, var(--terra) 12%, var(--paper));
			color: var(--terra);
			font-size: 11px;
			font-weight: 850;
			letter-spacing: .08em;
			text-transform: uppercase;
		}
		.recommendation h3 { margin-bottom: 7px; font-size: 19px; }
		.recommendation p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
		.tension {
			margin-top: 15px;
			padding: 11px 13px;
			border: 1px solid color-mix(in srgb, var(--honey) 55%, var(--line));
			border-radius: 10px;
			background: color-mix(in srgb, var(--honey) 12%, var(--paper));
			font-size: 12px;
			line-height: 1.5;
		}

		.section-heading { margin: 36px 0 15px; }
		.section-heading .kicker {
			margin-bottom: 5px;
			color: var(--terra);
			font-size: 11px;
			font-weight: 850;
			letter-spacing: .1em;
			text-transform: uppercase;
		}

		.direction-index {
			display: grid;
			grid-template-columns: repeat(5, minmax(0, 1fr));
			gap: 10px;
		}
		.direction-card {
			display: flex;
			min-height: 184px;
			flex-direction: column;
			align-items: stretch;
			padding: 14px;
			border: 1px solid var(--line);
			border-radius: var(--radius);
			background: var(--card);
			box-shadow: var(--soft-shadow);
		}
		.direction-card.recommended { border-top: 5px solid var(--terra); padding-top: 10px; }
		.direction-letter {
			display: grid;
			width: 36px;
			height: 36px;
			place-items: center;
			margin-bottom: 12px;
			border-radius: 9px;
			background: var(--grove);
			color: white;
			font-weight: 850;
		}
		.direction-card h3 { margin-bottom: 5px; font-size: 15px; }
		.direction-card p { flex: 1; margin-bottom: 12px; color: var(--muted); font-size: 11px; line-height: 1.45; }
		.direction-card .button { width: 100%; }

		.variant-stack { display: grid; gap: 22px; }
		.workspace[data-focus]:not([data-focus="all"]) .direction { display: none; }
		.workspace[data-focus="a"] .direction-a,
		.workspace[data-focus="b"] .direction-b,
		.workspace[data-focus="c"] .direction-c,
		.workspace[data-focus="d"] .direction-d,
		.workspace[data-focus="e"] .direction-e { display: block; }
		.direction {
			overflow: clip;
			border: 1px solid var(--line);
			border-radius: 18px;
			background: var(--paper);
			box-shadow: var(--shadow);
		}
		.direction-head {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			gap: 18px;
			align-items: start;
			padding: 22px;
			border-bottom: 1px solid var(--line);
		}
		.direction-title { display: flex; gap: 12px; align-items: start; }
		.direction-title .direction-letter { margin: 0; flex: 0 0 auto; }
		.direction-title h2 { margin-bottom: 5px; font-size: 23px; }
		.direction-title p { max-width: 720px; margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
		.pro-con {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 8px;
			width: min(100%, 330px);
		}
		.pro-con div { padding: 9px 10px; border-radius: 9px; background: #ede9df; }
		.pro-con strong { display: block; margin-bottom: 3px; font-size: 10px; text-transform: uppercase; letter-spacing: .07em; }
		.pro-con span { color: var(--muted); font-size: 11px; line-height: 1.35; }

		.surface-grid {
			display: grid;
			grid-template-columns: repeat(2, minmax(0, 1fr));
			gap: 14px;
			padding: 14px;
		}
		.mock {
			min-width: 0;
			border: 1px solid var(--line);
			border-radius: 14px;
			background: #d8d3c9;
			overflow: clip;
		}
		.mock-label {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			min-height: 38px;
			padding: 8px 11px;
			background: #ebe7de;
			color: var(--muted);
			font-size: 10px;
			font-weight: 800;
			letter-spacing: .07em;
			text-transform: uppercase;
		}
		.mock-label span:last-child { font-weight: 600; text-transform: none; letter-spacing: 0; }
		.device {
			container-type: inline-size;
			width: 100%;
			margin: 0 auto;
			background: var(--grove);
			transition: max-width 180ms ease;
		}
		.workspace[data-viewport="phone"] .device {
			max-width: 375px;
			border-inline: 1px solid rgb(255 255 255 / 22%);
		}
		.workspace[data-viewport="desktop"] .phone-only { display: none !important; }
		.workspace[data-viewport="phone"] .desktop-only { display: none !important; }
		.mini-ribbon {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			min-height: 58px;
			padding: 9px 12px;
			background: var(--grove);
			color: white;
		}
		.mini-title { min-width: 0; }
		.mini-title small {
			display: block;
			margin-bottom: 1px;
			color: #c9dbcD;
			font-size: 8px;
			font-weight: 800;
			letter-spacing: .09em;
			text-transform: uppercase;
		}
		.mini-title strong {
			display: block;
			overflow: hidden;
			font-size: 15px;
			letter-spacing: -.02em;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.mini-actions { display: flex; flex: 0 0 auto; gap: 4px; align-items: center; }
		.mini-button {
			display: inline-flex;
			min-height: 36px;
			align-items: center;
			justify-content: center;
			gap: 4px;
			border: 1px solid rgb(255 255 255 / 30%);
			border-radius: 7px;
			padding: 0 8px;
			background: transparent;
			color: white;
			font-size: 9px;
			font-weight: 780;
			white-space: nowrap;
		}
		.mini-button.primary { border-color: var(--terra); background: var(--terra); }
		.mini-button.icon { width: 36px; padding: 0; font-size: 15px; }
		.mini-utility {
			padding: 8px 12px 10px;
			background: var(--grove);
			color: white;
		}
		.work-surface {
			min-height: 240px;
			margin-inline: 5px;
			padding: 10px;
			border-radius: 13px 13px 0 0;
			background: var(--paper);
		}
		.week-row {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			font-size: 10px;
		}
		.week-row strong { font-size: 11px; }
		.mini-field {
			display: flex;
			min-width: 0;
			min-height: 36px;
			align-items: center;
			border: 1px solid rgb(255 255 255 / 25%);
			border-radius: 7px;
			padding: 0 9px;
			background: rgb(255 255 255 / 10%);
			color: white;
			font-size: 9px;
		}
		.paper-field {
			display: flex;
			min-width: 0;
			min-height: 36px;
			align-items: center;
			border: 1px solid var(--line);
			border-radius: 7px;
			padding: 0 9px;
			background: var(--card);
			color: var(--ink);
			font-size: 9px;
		}
		.filter-key {
			display: inline-flex;
			min-height: 32px;
			align-items: center;
			justify-content: center;
			border: 1px solid rgb(255 255 255 / 28%);
			border-radius: 7px;
			padding: 0 8px;
			background: rgb(255 255 255 / 8%);
			color: white;
			font-size: 8px;
			font-weight: 750;
			white-space: nowrap;
		}
		.filter-key.active { background: white; color: var(--grove); }
		.card-stack { display: grid; gap: 7px; }
		.two-line-card {
			display: grid;
			gap: 5px;
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 7px 8px;
			background: var(--card);
			box-shadow: 0 3px 8px rgb(35 58 46 / 6%);
		}
		.object-line {
			display: flex;
			min-width: 0;
			align-items: center;
			gap: 7px;
		}
		.object-line .grow { min-width: 0; flex: 1; }
		.object-line strong {
			display: block;
			overflow: hidden;
			font-size: 10px;
			text-overflow: ellipsis;
			white-space: nowrap;
		}
		.object-line small { color: var(--muted); font-size: 8px; }
		.check {
			display: grid;
			width: 22px;
			height: 22px;
			flex: 0 0 auto;
			place-items: center;
			border: 1px solid var(--line);
			border-radius: 6px;
			color: var(--grove);
			font-size: 10px;
		}
		.portions {
			display: inline-flex;
			flex: 0 0 auto;
			align-items: center;
			gap: 4px;
			min-height: 25px;
			padding: 0 6px;
			border: 1px solid var(--line);
			border-radius: 6px;
			background: var(--paper);
			font-size: 8px;
			font-weight: 760;
		}
		.segment {
			display: inline-flex;
			min-height: 28px;
			align-items: center;
			border-radius: 7px;
			padding: 2px;
			background: #ebe7de;
			font-size: 8px;
			font-weight: 740;
		}
		.segment span { display: grid; min-height: 24px; place-items: center; padding: 0 7px; border-radius: 5px; }
		.segment .selected { border: 1px solid var(--line); background: white; box-shadow: 0 1px 4px rgb(0 0 0 / 8%); }
		.more-key {
			display: inline-flex;
			min-height: 28px;
			align-items: center;
			border: 1px solid var(--line);
			border-radius: 6px;
			padding: 0 7px;
			color: var(--grove);
			font-size: 8px;
			font-weight: 760;
		}
		.shortlist {
			display: grid;
			gap: 5px;
			margin-top: 8px;
			padding-top: 8px;
			border-top: 1px solid var(--line);
		}
		.shortlist-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
		.shortlist-head strong { font-size: 10px; }
		.shortlist-head span { color: var(--muted); font-size: 8px; }
		.shortlist-row {
			display: grid;
			grid-template-columns: minmax(0, 1fr) auto;
			align-items: center;
			gap: 7px;
			min-height: 34px;
			padding: 5px 7px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--card);
			font-size: 8px;
		}
		.shortlist-row strong { display: block; font-size: 9px; }
		.shortlist-row span { color: var(--muted); }

		.filter-layout { display: grid; gap: 6px; }
		.search-sort { display: grid; grid-template-columns: minmax(0, 1fr) minmax(92px, .35fr); gap: 6px; }
		.status-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
		.select-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
		.recipe-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 8px; }
		.recipe-card {
			min-width: 0;
			overflow: clip;
			border: 1px solid var(--line);
			border-radius: 10px;
			background: var(--card);
		}
		.recipe-main { display: grid; grid-template-columns: 62px minmax(0, 1fr); min-height: 65px; }
		.food-photo {
			position: relative;
			overflow: hidden;
			background: #d6b97c;
		}
		.food-photo::before, .food-photo::after {
			position: absolute;
			border-radius: 50%;
			content: "";
		}
		.food-photo::before { width: 42px; height: 42px; left: 10px; top: 11px; background: #f4e5bd; box-shadow: inset 0 0 0 8px #9d5f35; }
		.food-photo::after { width: 15px; height: 8px; left: 24px; top: 28px; background: #476647; transform: rotate(-18deg); }
		.food-photo.green { background: #8aa27c; }
		.food-photo.terra { background: #c78768; }
		.recipe-copy { display: grid; align-content: center; gap: 3px; min-width: 0; padding: 7px; }
		.recipe-copy strong { overflow: hidden; font-size: 10px; text-overflow: ellipsis; white-space: nowrap; }
		.recipe-copy small { color: var(--muted); font-size: 8px; }
		.recipe-meta { display: flex; flex-wrap: wrap; gap: 3px 6px; color: var(--muted); font-size: 7px; }
		.recipe-actions { display: flex; justify-content: space-between; gap: 5px; padding: 5px 7px; border-top: 1px solid var(--line); }
		.text-action { color: var(--grove); font-size: 8px; font-weight: 780; }

		.stock-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 5px; }
		.metric {
			display: flex;
			min-height: 36px;
			align-items: center;
			gap: 6px;
			padding: 5px 7px;
			border: 1px solid rgb(255 255 255 / 22%);
			border-radius: 8px;
			background: rgb(255 255 255 / 8%);
			color: white;
			font-size: 8px;
		}
		.metric strong { font-size: 14px; }
		.stock-filter-row { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, minmax(76px, .38fr)); gap: 5px; margin-top: 6px; }
		.stock-columns { display: grid; grid-template-columns: 1.25fr .75fr; gap: 9px; }
		.group-title { display: flex; align-items: baseline; justify-content: space-between; gap: 7px; margin-bottom: 5px; }
		.group-title strong { font-size: 10px; }
		.group-title span { color: var(--muted); font-size: 8px; }
		.stock-card {
			position: relative;
			display: grid;
			gap: 4px;
			min-width: 0;
			border: 1px solid var(--line);
			border-radius: 10px;
			padding: 7px 8px 7px 10px;
			background: var(--card);
		}
		.stock-card.attention::before {
			position: absolute;
			inset-block: 7px;
			left: 3px;
			width: 3px;
			border-radius: 3px;
			background: var(--honey);
			content: "";
		}
		.qty { display: inline-flex; min-height: 27px; align-items: center; border: 1px solid var(--line); border-radius: 7px; overflow: clip; font-size: 8px; }
		.qty span { display: grid; min-width: 25px; min-height: 25px; place-items: center; }
		.qty span + span { border-left: 1px solid var(--line); }
		.stock-meta { overflow: hidden; color: var(--muted); font-size: 8px; line-height: 1.35; text-overflow: ellipsis; white-space: nowrap; }
		.stock-meta.warning { color: #8b5714; font-weight: 700; }

		.sheet {
			margin-left: auto;
			width: min(100%, 470px);
			min-height: 360px;
			background: var(--paper);
			color: var(--ink);
		}
		.sheet-head {
			display: flex;
			min-height: 50px;
			align-items: center;
			justify-content: space-between;
			gap: 10px;
			padding: 9px 12px;
			border-bottom: 1px solid var(--line);
		}
		.sheet-head strong { font-size: 13px; }
		.sheet-body { padding: 9px; }
		.ah-summary {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 8px;
			margin-bottom: 7px;
			padding: 7px 9px;
			border-radius: 8px;
			background: color-mix(in srgb, var(--grove) 8%, var(--paper));
			font-size: 8px;
		}
		.ah-list { display: grid; gap: 6px; }
		.ah-row {
			display: grid;
			gap: 5px;
			border: 1px solid var(--line);
			border-radius: 9px;
			padding: 7px;
			background: var(--card);
		}
		.ah-row.needs-look { border-color: color-mix(in srgb, var(--honey) 65%, var(--line)); background: color-mix(in srgb, var(--honey) 8%, var(--card)); }
		.ah-product { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; align-items: center; gap: 7px; }
